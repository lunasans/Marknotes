# Paket bauen und als GitHub-Release veröffentlichen, sobald ein Tag
# gepusht wird:
#
#   git tag v1.0.1
#   git push origin v1.0.1
#
# Der BigWigs-Packager baut die ZIP (Inhalt laut .pkgmeta), setzt die
# Version aus dem Tag in die TOC (@project-version@) und hängt sie an
# ein GitHub-Release. Wago holt sich das Release selbst über den
# Webhook im Repository (Settings -> Webhooks, Ereignis "Releases") -
# deshalb hier kein direkter Upload zu Wago, sonst käme jede Version
# doppelt an.
#
# Tags mit "alpha"/"beta" im Namen werden als Vorabversion markiert.
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
